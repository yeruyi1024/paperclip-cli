services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data

  server:
    image: paperclip-hermes-nexa:P06270-H0516
    ports:
      - "3100:3100"
      - "23001:3001"
    environment:
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - ./data/paperclip-data/instances:/paperclip/instances
      - ./data/paperclip-data/.hermes:/paperclip/.hermes
      - ./data/paperclip-data/.claude:/paperclip/.claude
      - ./data/paperclip-data/.claude.json:/paperclip/.claude.json
      - ./skills:/skills
      - ./shared:/shared
      - ./corp:/corp
      - /Users/yeruyi/Documents/workspace-agentmanager/nexa-saas-repo:/nexa-saas
      - /Users/yeruyi/Documents/workspace-agentmanager/nexal-monitor:/nexal-monitor
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
